# Compila la imagen y la publica en Artifact Registry. El despliegue se hace aparte:
#   gcloud run deploy white-avenue --image=<imagen> --region=us-central1
substitutions:
  _IMAGE: us-central1-docker.pkg.dev/$PROJECT_ID/infinity/white-avenue
steps:
  - name: gcr.io/cloud-builders/docker
    args: ['build', '-t', '${_IMAGE}:$SHORT_SHA', '-t', '${_IMAGE}:latest', '.']
images:
  - '${_IMAGE}:$SHORT_SHA'
  - '${_IMAGE}:latest'
